{% extends 'base.html' %}
{% block title %}{{ title or 'Message' }}{% endblock %}
{% block content %}
<div class="intro"><h1>{{ title or 'Action needs attention' }}</h1></div>
<section>
<p>{{ message }}</p>
{% if reasons %}<ul>{% for r in reasons %}<li>{{ r }}</li>{% endfor %}</ul>{% endif %}
<p><a class="button secondary" href="/inbox" data-back>← Go back</a> <a class="button secondary" href="/inbox">Inbox</a> <a class="button secondary" href="/status">Status</a></p>
</section>
{% endblock %}
